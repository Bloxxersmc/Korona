<style>

body {

========================================================= */

.status-dot {

<script>
/*
================================================================
CONFIGURATION
================================================================

REPLACE THESE TWO VALUES.

Supabase URL:
https://YOUR-PROJECT.supabase.co

Supabase publishable/anon key:
Your public browser key.

DO NOT USE:
service_role
secret key
admin key

Those must never be placed in this HTML.
================================================================
*/

const SUPABASE_URL =
    "https://wlzvcbisyueopwxcgwiv.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_S4F7YPq8ySSXNm5BL6tiaA_cuZXLud6";


/*
================================================================
PROTECTED PAGE
================================================================
*/

const PROTECTED_URL =
    "https://storage.googleapis.com/mathhw/practice.html";


/*
================================================================
SUPABASE REST API
================================================================
*/

const REST_URL =
    SUPABASE_URL + "/rest/v1";


function supabaseHeaders() {

    return {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization":
            "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type":
            "application/json"
    };
}


/*
================================================================
LOCAL USER INFORMATION
================================================================
*/

const USER_KEY =
    "korona_user";

const SESSION_KEY =
    "korona_session";


function loadLocalUser() {

    try {

        const raw =
            localStorage.getItem(USER_KEY);

        if (!raw) return null;

        return JSON.parse(raw);

    } catch {

        return null;
    }
}


function saveLocalUser(user) {

    localStorage.setItem(
        USER_KEY,
        JSON.stringify(user)
    );
}


function makeKoronaId(firstName, lastName) {

    const first =
        firstName
            .trim()
            .replace(/[^a-zA-Z0-9]/g, "")
            .toUpperCase();

    const last =
        lastName
            .trim()
            .replace(/[^a-zA-Z0-9]/g, "")
            .toUpperCase();

    return first + "." + last;
}


/*
================================================================
DATABASE HELPERS
================================================================
*/

async function databaseRequest(
    table,
    options = {}
) {

    const url =
        REST_URL +
        "/" +
        table +
        (options.query || "");

    const response =
        await fetch(
            url,
            {
                method:
                    options.method || "GET",

                headers: {
                    ...supabaseHeaders(),

                    ...(options.headers || {})
                },

                body:
                    options.body
                        ? JSON.stringify(options.body)
                        : undefined
            }
        );

    const text =
        await response.text();

    let data = null;

    try {
        data =
            text
                ? JSON.parse(text)
                : null;

    } catch {

        data = text;
    }


    if (!response.ok) {

        throw new Error(
            data?.message ||
            data?.hint ||
            data?.error_description ||
            "Database request failed."
        );
    }


    return data;
}


/*
================================================================
FIRST-TIME USER CREATION
================================================================
*/

async function createUser() {

    const firstName =
        document
            .getElementById("first-name")
            .value
            .trim();

    const lastName =
        document
            .getElementById("last-name")
            .value
            .trim();

    const error =
        document
            .getElementById("setup-error");

    const button =
        document
            .getElementById("create-user-button");


    error.textContent = "";
    error.className = "";


    if (!firstName || !lastName) {

        error.textContent =
            "Enter both your first and last name.";

        error.style.color =
            "#ff4d79";

        return;
    }


    const userId =
        makeKoronaId(
            firstName,
            lastName
        );


    if (
        userId.length < 3 ||
        !userId.includes(".")
    ) {

        error.textContent =
            "Please enter a valid first and last name.";

        error.style.color =
            "#ff4d79";

        return;
    }


    button.disabled = true;

    button.textContent =
        "Creating ID...";


    try {

        /*
         * Check whether this ID already exists.
         */

        const existing =
            await databaseRequest(
                "korona_users",
                {
                    query:
                        "?select=id,first_name,last_name,active" +
                        "&id=eq." +
                        encodeURIComponent(userId)
                }
            );


        if (existing.length > 0) {

            error.textContent =
                "That Korona ID already exists. " +
                "Use the existing ID on this device.";

            error.style.color =
                "#ff4d79";

            return;
        }


        /*
         * Register user.
         */

        const created =
            await databaseRequest(
                "korona_users",
                {
                    method: "POST",

                    query:
                        "?select=id,first_name,last_name,active",

                    headers: {
                        "Prefer":
                            "return=representation"
                    },

                    body: {
                        id: userId,

                        first_name:
                            firstName,

                        last_name:
                            lastName,

                        active: true
                    }
                }
            );


        if (!created || !created.length) {

            throw new Error(
                "User registration failed."
            );
        }


        const user = {

            id: userId,

            firstName: firstName,

            lastName: lastName
        };


        saveLocalUser(user);


        /*
         * Switch to login screen.
         */

        showLogin(user);


    } catch (err) {

        console.error(err);

        error.textContent =
            "Unable to create your Korona ID: " +
            err.message;

        error.style.color =
            "#ff4d79";

    } finally {

        button.disabled = false;

        button.textContent =
            "Create Korona ID";
    }
}


/*
================================================================
SHOW LOGIN
================================================================
*/

function showLogin(user) {

    document
        .getElementById("setup-card")
        .style.display = "none";


    document
        .getElementById("login-card")
        .style.display = "block";


    document
        .getElementById("current-id")
        .style.display = "block";


    document
        .getElementById("display-user-id")
        .textContent =
        user.id;


    document
        .getElementById("login-user-id")
        .textContent =
        user.id;


    document
        .getElementById("tagline")
        .textContent =
        "enter credentials to unlock page";


    setTimeout(() => {

        document
            .getElementById("auth-code")
            .focus();

    }, 100);
}


/*
================================================================
LOGIN
================================================================
*/

async function login() {

    const user =
        loadLocalUser();

    if (!user) {

        location.reload();

        return;
    }


    const code =
        document
            .getElementById("auth-code")
            .value
            .trim();


    const error =
        document
            .getElementById("login-error");


    const button =
        document
            .getElementById("login-button");


    error.textContent = "";

    error.className = "";


    if (!code) {

        error.textContent =
            "Enter your authentication code.";

        error.style.color =
            "#ff4d79";

        return;
    }


    button.disabled = true;

    button.textContent =
        "Checking...";


    try {

        /*
         * Look up this user's current
         * authorization status.
         */

        const users =
            await databaseRequest(
                "korona_users",
                {
                    query:
                        "?select=id,first_name,last_name,active,auth_code" +
                        "&id=eq." +
                        encodeURIComponent(user.id) +
                        "&limit=1"
                }
            );


        if (!users.length) {

            throw new Error(
                "Korona ID was not found."
            );
        }


        const remoteUser =
            users[0];


        /*
         * REMOTE REVOCATION CHECK
         */

        if (!remoteUser.active) {

            error.textContent =
                "Access revoked by administrator.";

            error.style.color =
                "#ff4d79";

            return;
        }


        /*
         * Authentication code check.
         *
         * NOTE:
         * For a production deployment, do NOT store
         * plaintext authentication codes.
         * Use a server-side authentication function.
         */

        if (
            remoteUser.auth_code !== code
        ) {

            error.textContent =
                "Incorrect authentication code.";

            error.style.color =
                "#ff4d79";

            document
                .getElementById("auth-code")
                .value = "";

            return;
        }


        /*
         * Successful login.
         */

        localStorage.setItem(
            SESSION_KEY,
            JSON.stringify({
                userId: user.id,
                loginTime: Date.now()
            })
        );


        unlockPage();


    } catch (err) {

        console.error(err);

        error.textContent =
            "Login failed: " +
            err.message;

        error.style.color =
            "#ff4d79";

    } finally {

        button.disabled = false;
