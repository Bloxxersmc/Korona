<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Korona Browser</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #12020b;

    color: #f3cbdc;

    font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;
}


/* =========================================================
   BROWSER
========================================================= */

#browser {

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
}


.browser-header {

    height: 58px;

    flex-shrink: 0;

    display: flex;
    align-items: center;

    gap: 14px;

    padding: 9px 16px;

    background: #210414;

    border-bottom:
        1px solid #3d0a27;
}


.tab {

    padding:
        9px 20px;

    background: #1a0311;

    border:
        1px solid #3d0a27;

    border-bottom: none;

    border-radius:
        8px 8px 0 0;

    color: white;

    font-size: 13px;

    white-space: nowrap;
}


.address-bar {

    flex: 1;

    height: 38px;

    display: flex;
    align-items: center;

    padding:
        0 18px;

    background: #12020b;

    border:
        1px solid #3d0a27;

    border-radius: 20px;

    color: #8c5d77;

    font-size: 13px;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* =========================================================
   CONTENT
========================================================= */

.content {

    position: relative;

    flex: 1;

    min-height: 0;
}


/* =========================================================
   AUTH SCREEN
========================================================= */

#auth-container {

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 20px;
}


.logo {

    color: white;

    font-size: 64px;

    font-weight: 700;

    letter-spacing: -2px;

    margin-bottom: 5px;
}


.tagline {

    color: #c99cb3;

    font-size: 14px;

    margin-bottom: 30px;
}


.auth-card {

    width:
        min(520px, 100%);

    padding: 28px;

    background: #210414;

    border:
        1px solid #3d0a27;

    border-radius: 18px;

    box-shadow:
        0 20px 70px
        rgba(0, 0, 0, .35);
}


.auth-title {

    color: white;

    font-size: 19px;

    font-weight: 600;

    margin-bottom: 20px;
}


.field {

    margin-bottom: 15px;

    text-align: left;
}


.field label {

    display: block;

    margin-bottom: 7px;

    color: #a87591;

    font-size: 12px;
}


.field input {

    width: 100%;

    padding: 13px 15px;

    background: #12020b;

    border:
        1px solid #4a0d30;

    border-radius: 10px;

    outline: none;

    color: white;

    font-size: 15px;
}


.field input:focus {

    border-color: #b52b75;
}


.field input::placeholder {

    color: #5c344c;
}


.primary-button {

    width: 100%;

    padding: 13px 18px;

    margin-top: 5px;

    background: #3d0e28;

    border:
        1px solid #6b1847;

    border-radius: 10px;

    color: white;

    cursor: pointer;

    font-size: 14px;

    font-weight: 600;

    transition: .2s;
}


.primary-button:hover {

    background: #b52b75;

    border-color: #e63994;
}


.primary-button:disabled {

    opacity: .5;

    cursor: wait;
}


.message {

    min-height: 20px;

    margin-top: 15px;

    font-size: 13px;
}


.error {

    color: #ff4d79;
}


.success {

    color: #63d6a0;
}


.user-id {

    margin-top: 18px;

    color: #70445d;

    font-size: 11px;
}


.user-id strong {

    color: #c99cb3;
}


/* =========================================================
   PROTECTED PAGE
========================================================= */

#protected-iframe {

    width: 100%;
    height: 100%;

    display: none;

    border: none;
}


/* =========================================================
   TERMINAL BUTTON
========================================================= */

#terminal-button {

    position: fixed;

    right: 18px;

    bottom: 18px;

    z-index: 900;

    display: block;
}


.terminal-open-button {

    padding:
        10px 16px;

    background: #210414;

    border:
        1px solid #6b1847;

    border-radius: 9px;

    color: white;

    cursor: pointer;

    font-size: 12px;
}


.terminal-open-button:hover {

    background: #b52b75;
}


/* =========================================================
   TERMINAL OVERLAY
========================================================= */

#terminal-overlay {

    position: fixed;

    inset: 0;

    z-index: 2000;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 15px;

    background:
        rgba(4, 0, 3, .82);

    backdrop-filter:
        blur(5px);
}


#terminal {

    width:
        min(900px, 100%);

    height:
        min(600px, 100%);

    display: flex;

    flex-direction: column;

    overflow: hidden;

    background: #080408;

    border:
        1px solid #4d1740;

    border-radius: 10px;

    box-shadow:
        0 25px 80px
        rgba(0, 0, 0, .7);
}


.terminal-header {

    height: 43px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 14px;

    background: #210414;

    border-bottom:
        1px solid #3d0a27;

    color: white;

    font-family:
        Consolas,
        monospace;

    font-size: 13px;
}


.terminal-close {

    background: none;

    border: none;

    color: #c99cb3;

    cursor: pointer;

    font-size: 21px;
}


#terminal-output {

    flex: 1;

    overflow: auto;

    padding: 16px;

    color: #d8b5ca;

    font-family:
        Consolas,
        monospace;

    font-size: 13px;

    line-height: 1.6;

    white-space: pre-wrap;
}


.terminal-input-row {

    display: flex;

    padding: 12px 16px;

    border-top:
        1px solid #301027;
}


.prompt {

    padding-right: 8px;

    color: #e63994;

    font-family:
        Consolas,
        monospace;
}


#terminal-input {

    flex: 1;

    min-width: 0;

    background: transparent;

    border: none;

    outline: none;

    color: white;

    font-family:
        Consolas,
        monospace;

    font-size: 13px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .browser-header {

        height: 52px;

        padding: 7px;
    }

    .tab {

        padding:
            8px 12px;

        font-size: 11px;
    }

    .address-bar {

        font-size: 11px;
    }

    .logo {

        font-size: 50px;
    }

    .auth-card {

        padding: 22px;
    }
}

</style>
</head>


<body>


<!-- ========================================================
     BROWSER
========================================================= -->

<div id="browser">


    <!-- HEADER -->

    <div class="browser-header">

        <div class="tab">

            🔒 Korona Browser

        </div>


        <div
            class="address-bar"
            id="address-bar">

            korona://authentication-gate

        </div>

    </div>


    <!-- CONTENT -->

    <div class="content">


        <!-- ==================================================
             AUTHENTICATION
        ================================================== -->

        <div id="auth-container">


            <div class="logo">

                korona

            </div>


            <div
                class="tagline"
                id="tagline">

                first-time setup

            </div>


            <!-- ==============================================
                 SETUP
            =============================================== -->

            <div
                class="auth-card"
                id="setup-card">


                <div class="auth-title">

                    Create your Korona ID

                </div>


                <div class="field">

                    <label>
                        First name
                    </label>

                    <input
                        id="first-name"
                        type="text"
                        maxlength="40"
                        autocomplete="given-name"
                        placeholder="First name">

                </div>


                <div class="field">

                    <label>
                        Last name
                    </label>

                    <input
                        id="last-name"
                        type="text"
                        maxlength="40"
                        autocomplete="family-name"
                        placeholder="Last name">

                </div>


                <button
                    class="primary-button"
                    id="create-button"
                    type="button">

                    Create Korona ID

                </button>


                <div
                    id="setup-message"
                    class="message">

                </div>


            </div>


            <!-- ==============================================
                 LOGIN
            =============================================== -->

            <div
                class="auth-card"
                id="login-card"
                style="display:none;">


                <div class="auth-title">

                    Welcome back

                </div>


                <div class="user-id">

                    Korona ID:

                    <strong
                        id="login-user-id">
                    </strong>

                </div>


                <div
                    class="field"
                    style="margin-top:20px;">


                    <label>

                        Authentication code

                    </label>


                    <input
                        id="auth-code"
                        type="password"
                        autocomplete="off"
                        placeholder="Enter authentication code">

                </div>


                <button
                    class="primary-button"
                    id="login-button"
                    type="button">

                    Unlock Browser

                </button>


                <div
                    id="login-message"
                    class="message">

                </div>


            </div>


            <!-- CURRENT USER -->

            <div
                class="user-id"
                id="current-user"
                style="display:none;">

                Korona ID:

                <strong
                    id="display-user-id">
                </strong>

            </div>


        </div>


        <!-- ==================================================
             PROTECTED PAGE
        ================================================== -->

        <iframe
            id="protected-iframe"
            src="https://storage.googleapis.com/mathhw/practice.html"
            sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms"
            allow="pointer-lock">
        </iframe>


    </div>

</div>


<!-- ========================================================
     TERMINAL BUTTON
========================================================= -->

<div id="terminal-button">

    <button
        class="terminal-open-button"
        id="terminal-open">

        Terminal

    </button>

</div>


<!-- ========================================================
     TERMINAL
========================================================= -->

<div id="terminal-overlay">


    <div id="terminal">


        <div class="terminal-header">

            <span>

                korona-terminal

            </span>


            <button
                class="terminal-close"
                id="terminal-close">

                ×

            </button>

        </div>


        <div id="terminal-output">

        </div>


        <div class="terminal-input-row">

            <span class="prompt">

                korona&gt;

            </span>


            <input
                id="terminal-input"
                autocomplete="off"
                spellcheck="false"
                placeholder="Type help">

        </div>


    </div>

</div>


<!-- ========================================================
     SUPABASE
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE CONFIGURATION
========================================================= */

const SUPABASE_URL =
    "https://wlzvcbisyueopwxcgwiv.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_S4F7YPq8ySSXNm5BL6tiaA_cuZXLud6";


const {
    createClient
} = supabase;


const db =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   CONFIG
========================================================= */

const TABLE =
    "korona_users";


const PROTECTED_URL =
    "https://storage.googleapis.com/mathhw/practice.html";


const LOCAL_USER =
    "korona_user";


/* =========================================================
   ELEMENTS
========================================================= */

const setupCard =
    document.getElementById(
        "setup-card"
    );


const loginCard =
    document.getElementById(
        "login-card"
    );


const setupMessage =
    document.getElementById(
        "setup-message"
    );


const loginMessage =
    document.getElementById(
        "login-message"
    );


const createButton =
    document.getElementById(
        "create-button"
    );


const loginButton =
    document.getElementById(
        "login-button"
    );


/* =========================================================
   UTILITIES
========================================================= */

function getLocalUser() {

    try {

        const raw =
            localStorage.getItem(
                LOCAL_USER
            );

        if (!raw) {

            return null;

        }

        return JSON.parse(raw);

    } catch {

        return null;

    }

}


function saveLocalUser(user) {

    localStorage.setItem(
        LOCAL_USER,
        JSON.stringify(user)
    );

}


function makeUserId(
    first,
    last
) {

    const cleanFirst =
        first
            .trim()
            .replace(
                /[^a-zA-Z0-9]/g,
                ""
            )
            .toUpperCase();


    const cleanLast =
        last
            .trim()
            .replace(
                /[^a-zA-Z0-9]/g,
                ""
            )
            .toUpperCase();


    return (
        cleanFirst +
        "." +
        cleanLast
    );

}


function showMessage(
    element,
    text,
    type = "error"
) {

    element.textContent =
        text;

    element.className =
        "message " +
        type;

}


/* =========================================================
   INITIALIZE
========================================================= */

function initialize() {

    const user =
        getLocalUser();


    if (user) {

        showLogin(
            user
        );

    } else {

        setupCard.style.display =
            "block";

        loginCard.style.display =
            "none";

    }

}


function showLogin(user) {

    setupCard.style.display =
        "none";


    loginCard.style.display =
        "block";


    document.getElementById(
        "current-user"
    ).style.display =
        "block";


    document.getElementById(
        "display-user-id"
    ).textContent =
        user.id;


    document.getElementById(
        "login-user-id"
    ).textContent =
        user.id;


    document.getElementById(
        "tagline"
    ).textContent =
        "enter credentials to unlock page";

}


/* =========================================================
   CREATE USER
========================================================= */

async function createUser() {

    const first =
        document.getElementById(
            "first-name"
        ).value.trim();


    const last =
        document.getElementById(
            "last-name"
        ).value.trim();


    showMessage(
        setupMessage,
        ""
    );


    if (!first || !last) {

        showMessage(
            setupMessage,
            "Enter both your first and last name."
        );

        return;

    }


    const id =
        makeUserId(
            first,
            last
        );


    if (
        id.length < 3 ||
        !id.includes(".")
    ) {

        showMessage(
            setupMessage,
            "Please enter a valid first and last name."
        );

        return;

    }


    createButton.disabled =
        true;


    createButton.textContent =
        "Creating...";


    try {

        /*
         * Check for an existing ID.
         */

        const {
            data: existing,
            error: lookupError
        } =
            await db
                .from(TABLE)
                .select("id")
                .eq("id", id)
                .limit(1);


        if (lookupError) {

            throw lookupError;

        }


        if (
            existing &&
            existing.length > 0
        ) {

            showMessage(
                setupMessage,
                "That Korona ID already exists. Use a different name."
            );

            return;

        }


        /*
         * Create the user.
         *
         * auth_code is initially blank.
         * An administrator can assign the code
         * through the secure admin system.
         */

        const {
            data,
            error
        } =
            await db
                .from(TABLE)
                .insert({
                    id: id,

                    first_name: first,

                    last_name: last,

                    auth_code: "",

                    active: true
                })
                .select()
                .single();


        if (error) {

            throw error;

        }


        /*
         * Save locally.
         */

        const user = {

            id: data.id,

            firstName:
                data.first_name,

            lastName:
                data.last_name

        };


        saveLocalUser(
            user
        );


        showLogin(
            user
        );


        showMessage(
            loginMessage,
            "Korona ID created successfully.",
            "success"
        );


    } catch (error) {

        console.error(
            "Create user error:",
            error
        );


        showMessage(
            setupMessage,
            "Could not create ID: " +
            (
                error.message ||
                "Unknown error"
            )
        );

    } finally {

        createButton.disabled =
            false;

        createButton.textContent =
            "Create Korona ID";

    }

}


/* =========================================================
   LOGIN
========================================================= */

async function login() {

    const user =
        getLocalUser();


    if (!user) {

        location.reload();

        return;

    }


    const code =
        document.getElementById(
            "auth-code"
        ).value.trim();


    if (!code) {

        showMessage(
            loginMessage,
            "Enter your authentication code."
        );

        return;

    }


    loginButton.disabled =
        true;


    loginButton.textContent =
        "Checking...";


    try {

        /*
         * Always retrieve current status
         * from Supabase.
         *
         * This means a revoked user cannot
         * simply keep using an old browser session.
         */

        const {
            data,
            error
        } =
            await db
                .from(TABLE)
                .select(
                    "id,first_name,last_name,auth_code,active"
                )
                .eq("id", user.id)
                .limit(1)
                .single();


        if (error) {

            throw error;

        }


        if (!data.active) {

            showMessage(
                loginMessage,
                "Access has been revoked."
            );

            return;

        }


        if (!data.auth_code) {

            showMessage(
                loginMessage,
                "Your account has not been assigned an authentication code yet."
            );

            return;

        }


        if (
            data.auth_code !== code
        ) {

            showMessage(
                loginMessage,
                "Incorrect authentication code."
            );


            document.getElementById(
                "auth-code"
            ).value = "";


            return;

        }


        /*
         * Successful login.
         */

        unlockPage();


    } catch (error) {

        console.error(
            "Login error:",
            error
        );


        showMessage(
            loginMessage,
            "Login failed: " +
            (
                error.message ||
                "Unable to contact Supabase."
            )
        );

    } finally {

        loginButton.disabled =
            false;

        loginButton.textContent =
            "Unlock Browser";

    }

}


/* =========================================================
   UNLOCK
========================================================= */

function unlockPage() {

    document.getElementById(
        "auth-container"
    ).style.display =
        "none";


    document.getElementById(
        "protected-iframe"
    ).style.display =
        "block";


    document.getElementById(
        "address-bar"
    ).textContent =
        PROTECTED_URL;

}


/* =========================================================
   TERMINAL
========================================================= */

function openTerminal() {

    const overlay =
        document.getElementById(
            "terminal-overlay"
        );


    overlay.style.display =
        "flex";


    terminalPrint(
        "Korona Terminal"
    );


    terminalPrint(
        "Type 'help' for commands."
    );


    document.getElementById(
        "terminal-input"
    ).focus();

}


function closeTerminal() {

    document.getElementById(
        "terminal-overlay"
    ).style.display =
        "none";

}


function terminalPrint(text) {

    const output =
        document.getElementById(
            "terminal-output"
        );


    output.textContent +=
        text + "\n";


    output.scrollTop =
        output.scrollHeight;

}


/* =========================================================
   TERMINAL COMMANDS
========================================================= */

async function runCommand(command) {

    const parts =
        command
            .trim()
            .split(/\s+/);


    const cmd =
        (
            parts[0] ||
            ""
        ).toLowerCase();


    if (!cmd) {

        return;

    }


    /* HELP */

    if (cmd === "help") {

        terminalPrint(
`Available commands:

users
    List registered Korona IDs.

user <ID>
    Display a user's information.

check <ID>
    Check whether a user is active.

revoke <ID>
    Revoke a user's access.

restore <ID>
    Restore a user's access.

close
    Close terminal.

clear
    Clear terminal.`
        );

        return;

    }


    /* CLEAR */

    if (cmd === "clear") {

        document.getElementById(
            "terminal-output"
        ).textContent = "";

        return;

    }


    /* CLOSE */

    if (cmd === "close") {

        closeTerminal();

        return;

    }


    /* USERS */

    if (cmd === "users") {

        terminalPrint(
            "Loading users..."
        );


        try {

            const {
                data,
                error
            } =
                await db
                    .from(TABLE)
                    .select(
                        "id,first_name,last_name,active,created_at"
                    )
                    .order(
                        "created_at",
                        {
                            ascending: true
                        }
                    );


            if (error) {

                throw error;

            }


            if (!data.length) {

                terminalPrint(
                    "No users registered."
                );

                return;

            }


            let output =
                "\n";


            for (
                const user of data
            ) {

                output +=
                    user.id +
                    " | " +
                    (
                        user.active
                            ? "ACTIVE"
                            : "REVOKED"
                    ) +
                    " | " +
                    user.first_name +
                    " " +
                    user.last_name +
                    "\n";

            }


            terminalPrint(
                output
            );


        } catch (error) {

            terminalPrint(
                "ERROR: " +
                error.message
            );

        }


        return;

    }


    /* USER */

    if (cmd === "user") {

        const id =
            parts[1];


        if (!id) {

            terminalPrint(
                "Usage: user <ID>"
            );

            return;

        }


        try {

            const {
                data,
                error
            } =
                await db
                    .from(TABLE)
                    .select(
                        "id,first_name,last_name,active,created_at"
                    )
                    .eq(
                        "id",
                        id
                    )
                    .single();


            if (error) {

                throw error;

            }


            terminalPrint(
                JSON.stringify(
                    data,
                    null,
                    2
                )
            );


        } catch (error) {

            terminalPrint(
                "ERROR: " +
                error.message
            );

        }


        return;

    }


    /* CHECK */

    if (cmd === "check") {

        const id =
            parts[1];


        if (!id) {

            terminalPrint(
                "Usage: check <ID>"
            );

            return;

        }


        try {

            const {
                data,
                error
            } =
                await db
                    .from(TABLE)
                    .select(
                        "id,active"
                    )
                    .eq(
                        "id",
                        id
                    )
                    .single();


            if (error) {

                throw error;

            }


            terminalPrint(
                data.id +
                ": " +
                (
                    data.active
                        ? "ACTIVE"
                        : "REVOKED"
                )
            );


        } catch (error) {

            terminalPrint(
                "ERROR: " +
                error.message
            );

        }


        return;

    }


    /*
     * IMPORTANT:
     *
     * revoke / restore intentionally go
     * through the admin Edge Function.
     */

    if (
        cmd === "revoke" ||
        cmd === "restore"
    ) {

        const id =
            parts[1];


        if (!id) {

            terminalPrint(
                "Usage: " +
                cmd +
                " <ID>"
            );

            return;

        }


        terminalPrint(
            "This command requires administrator authorization."
        );


        terminalPrint(
            "Configure the Korona admin Edge Function before using " +
            cmd +
            "."
        );


        return;

    }


    terminalPrint(
        "Unknown command. Type 'help'."
    );

}


/* =========================================================
   BUTTONS
========================================================= */

createButton.addEventListener(
    "click",
    createUser
);


loginButton.addEventListener(
    "click",
    login
);


document.getElementById(
    "terminal-open"
).addEventListener(
    "click",
    openTerminal
);


document.getElementById(
    "terminal-close"
).addEventListener(
    "click",
    closeTerminal
);


/* =========================================================
   ENTER TO LOGIN
========================================================= */

document.getElementById(
    "auth-code"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            login();

        }

    }
);


/* =========================================================
   TERMINAL ENTER
========================================================= */

document.getElementById(
    "terminal-input"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            const input =
                event.target;


            const command =
                input.value;


            terminalPrint(
                "korona> " +
                command
            );


            input.value =
                "";


            runCommand(
                command
            );

        }

    }
);


/* =========================================================
   CTRL+\

   event.code is used instead of only event.key,
   because browsers can report "\" differently
   depending on keyboard layout.
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.ctrlKey &&
            event.code === "Backslash"
        ) {

            event.preventDefault();

            openTerminal();

        }

    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeTerminal();

        }

    }
);


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    initialize
);

</script>
