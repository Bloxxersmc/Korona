<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korona Browser</title>
    <style>
        /* Base Styling to match the Korona UI */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #12020b; /* Deep Korona dark plum background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f3cbdc;
        }

        /* Iframe Styles */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* Hidden until authenticated */
        }

        /* Full layout container splits sidebar and main window */
        #ui-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Sidebar Navigation UI */
        .sidebar {
            width: 240px;
            background-color: #210414;
            border-right: 1px solid #3d0a27;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .brand-title {
            font-size: 26px;
            font-weight: bold;
            padding-left: 30px;
            margin-bottom: 30px;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .nav-item {
            padding: 14px 30px;
            font-size: 16px;
            color: #c99cb3;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            background-color: #3d0e28;
            color: #ffffff;
            border-left: 4px solid #b52b75;
            padding-left: 26px;
        }

        .nav-item:hover:not(.active) {
            background-color: #2d081c;
            color: #ffffff;
        }

        /* Main Workspace Panel */
        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1a0311;
        }

        /* Mock Browser Address Bar Header */
        .browser-header {
            background-color: #210414;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #3d0a27;
            gap: 15px;
        }

        .tab {
            background-color: #1a0311;
            color: #ffffff;
            padding: 8px 25px;
            border-radius: 8px 8px 0 0;
            font-size: 13px;
            border: 1px solid #3d0a27;
            border-bottom: none;
        }

        .address-bar-container {
            flex: 1;
            background-color: #12020b;
            border: 1px solid #3d0a27;
            border-radius: 20px;
            padding: 6px 20px;
            color: #8c5d77;
            font-size: 14px;
        }

        /* Center Content Area */
        .content-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Authentication Screen Graphic Styling */
        #auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            width: 100%;
            height: 100%;
            text-align: center;
        }

        /* Stylized Main Input Area matching Korona search bar layout */
        .logo-text {
            font-size: 64px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }
        
        .sub-tagline {
            font-size: 14px;
            color: #c99cb3;
            margin-bottom: 40px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background-color: #210414;
            border: 1px solid #4a0d30;
            border-radius: 30px;
            width: 550px;
            padding: 5px 10px 5px 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .input-wrapper:focus-within {
            border-color: #b52b75;
        }

        input[type="password"] {
            flex: 1;
            border: none;
            background: transparent;
            color: #ffffff;
            font-size: 18px;
            outline: none;
            padding: 10px 0;
        }

        input[type="password"]::placeholder {
            color: #5c344c;
        }

        .submit-btn {
            background-color: #3d0e28;
            color: #ffffff;
            border: 1px solid #6b1847;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #b52b75;
            border-color: #e63994;
        }

        #error-msg {
            color: #ff4d79;
            margin-top: 20px;
            font-size: 14px;
            height: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div id="ui-wrapper">
        <!-- Korona Sidebar Element -->
        <div class="sidebar">
            <div class="brand-title">korona</div>
            <div class="nav-item">Home</div>
            <div class="nav-item">Games</div>
            <div class="nav-item">Apps</div>
            <div class="nav-item active">Browser</div>
            <div class="nav-item">Settings</div>
            <div class="nav-item">Account</div>
        </div>

        <!-- Right Side Panel Contents -->
        <div class="main-panel">
            <!-- Navigation Header Bar -->
            <div class="browser-header">
                <div class="tab">🔒 Verification Required</div>
                <div class="address-bar-container" id="address-bar">
                    korona://authentication-gate
                </div>
            </div>

            <!-- Central Target Viewport -->
            <div class="content-container">
                
                <!-- Korona Lookalike Authentication Screen -->
                <div id="auth-container">
                    <div class="logo-text">korona</div>
                    <div class="sub-tagline">enter credentials to unlock page</div>
                    
                    <div class="input-wrapper">
                        <input type="password" id="code-input" placeholder="Enter Authentication Code..." onkeydown="if(event.key === 'Enter') checkCode()">
                        <button class="submit-btn" onclick="checkCode()">Go →</button>
                    </div>
                    <div id="error-msg"></div>
                </div>

                <!-- Protected Dynamic Iframe Element with Mouse Lock Access -->
                <iframe 
                    id="protected-iframe" 
                    src="https://googleapis.com" 
                    sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms"
                    allow="pointer-lock">
                </iframe>

            </div>
        </div>
    </div>

    <script>

        const CORRECT_CODE = "FERNISBETTER"; 
        const COOKIE_NAME = "korona_auth_token";

        // Cookie Utility Helper Functions
        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                const date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Strict";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        // Run validation layout toggles
        function unlockPage() {
            document.getElementById("auth-container").style.display = "none";
            
            // Un-nest the layout wrappers so iframe occupies 100% full screen
            const iframe = document.getElementById("protected-iframe");
            document.body.appendChild(iframe);
            iframe.style.display = "block";
            
            // Remove parent interface frameworks
            document.getElementById("ui-wrapper").remove();
        }

        function checkCode() {
            const inputField = document.getElementById("code-input");
            const errorMessage = document.getElementById("error-msg");

            if (inputField.value === CORRECT_CODE) {
                // Save string code configuration into cookies valid for 7 days
                setCookie(COOKIE_NAME, inputField.value, 7);
                unlockPage();
            } else {
                errorMessage.textContent = "Access Denied. Incorrect verification token.";
                inputField.value = "";
                inputField.focus();
            }
        }

        // On initialization load, verify if valid session cookie exists
        window.onload = function() {
            const savedCode = getCookie(COOKIE_NAME);
            if (savedCode === CORRECT_CODE) {
                unlockPage();
            }
        };
    </script>
</body>
</html>
