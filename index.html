<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Practice Page</title>
    <style>
        /* Make the iframe take up the entire viewport */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* Hidden until authenticated */
        }
        /* Style for the authentication overlay */
        #auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: white;
        }
        .auth-box {
            background: #222;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #333;
            color: white;
            margin-bottom: 15px;
            width: 200px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        #error-msg {
            color: #ff4d4d;
            margin-top: 10px;
            font-size: 14px;
            height: 18px;
        }
    </style>
</head>
<body>

    <!-- Authentication Screen -->
    <div id="auth-container">
        <div class="auth-box">
            <h2>Enter Authentication Code</h2>
            <input type="password" id="code-input" placeholder="Enter Code" onkeydown="if(event.key === 'Enter') checkCode()">
            <br>
            <button onclick="checkCode()">Submit</button>
            <div id="error-msg"></div>
        </div>
    </div>

    <!-- The Full-Screen Iframe -->
    <!-- 'allow-pointer-lock' enables mouse lock -->
    <iframe 
        id="protected-iframe" 
        src="https://storage.googleapis.com/mathhw/practice.html" 
        sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms"
        allow="pointer-lock">
    </iframe>

    <script>
        // Set your desired authentication code here
        const CORRECT_CODE = "FERNISBETTER"; 

        function checkCode() {
            const inputField = document.getElementById("code-input");
            const errorMessage = document.getElementById("error-msg");
            const authContainer = document.getElementById("auth-container");
            const iframe = document.getElementById("protected-iframe");

            if (inputField.value === CORRECT_CODE) {
                // Hide auth screen and display the iframe
                authContainer.style.display = "none";
                iframe.style.display = "block";
            } else {
                errorMessage.textContent = "Invalid code. Please try again.";
                inputField.value = "";
                inputField.focus();
            }
        }
    </script>
</body>
</html>
